# Plaats deze locaties binnen het bestaande server {}-blok voor kr8tig.nl.
# De bestaande root, SSL- en assetinstellingen blijven ongewijzigd.

# Behoud bestaande links in zoekmachines en bladwijzers, maar stuur ze door
# naar de canonieke URL zonder .html.
location = /index.html {
    return 301 /;
}

location ~ ^/(.+)\.html$ {
    return 301 /$1$is_args$args;
}

# Probeer eerst bestanden en mappen; zoek daarna naar de bijbehorende
# statische HTML-pagina. Bijvoorbeeld: /afdelingen -> /afdelingen.html.
location / {
    try_files $uri $uri/ $uri.html =404;
}
